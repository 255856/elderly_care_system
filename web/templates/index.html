<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智慧养老系统</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        #bg-layer {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            z-index: -1;
            opacity: 0;
            transition: opacity 0.3s ease;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        #bg-layer.loaded { opacity: 1; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Microsoft YaHei', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            text-align: center;
            background: rgba(255,255,255,0.95);
            padding: 48px 40px;
            border-radius: 12px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.15);
            max-width: 480px;
            width: 90%;
        }
        .container h1 { font-size: 28px; color: #333; margin-bottom: 8px; font-weight: 600; }
        .container .desc { color: #888; font-size: 14px; margin-bottom: 32px; line-height: 1.6; }

        .btn {
            display: inline-block;
            background: #764ba2;
            color: #fff;
            padding: 12px 40px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 16px;
            transition: background 0.2s;
        }
        .btn:hover { background: #5e3b82; }

        .footer { margin-top: 32px; color: #bbb; font-size: 12px; }

        /* 背景设置入口 */
        .bg-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 44px;
            height: 44px;
            background: rgba(255,255,255,0.9);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            font-size: 18px;
            z-index: 999;
            transition: transform 0.2s;
            border: none;
        }
        .bg-toggle:hover { transform: scale(1.08); }

        .bg-modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .bg-modal-body {
            background: #fff;
            width: 400px;
            max-width: 90%;
            padding: 28px 24px;
            border-radius: 10px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.2);
        }
        .bg-modal-body h3 { font-size: 16px; color: #333; margin-bottom: 20px; }
        .bg-option { margin-bottom: 16px; }
        .bg-option label { display: block; font-size: 13px; color: #555; margin-bottom: 6px; }
        .bg-option input[type="file"],
        .bg-option input[type="text"] {
            width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px;
        }
        .preset-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
        .preset-dot {
            width: 36px; height: 36px; border-radius: 8px; cursor: pointer;
            border: 2px solid transparent; transition: transform 0.15s;
        }
        .preset-dot:hover { transform: scale(1.1); border-color: #764ba2; }
        .bg-preview { width: 100%; height: 80px; border-radius: 8px; margin: 12px 0; border: 1px solid #eee; }
        .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
        .modal-actions button {
            padding: 7px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 13px;
        }
        .btn-primary { background: #764ba2; color: #fff; }
        .btn-primary:hover { background: #5e3b82; }
        .btn-muted { background: #eee; color: #555; }
        .btn-muted:hover { background: #ddd; }
        .btn-link {
            background: none; color: #764ba2; border: none; cursor: pointer; font-size: 12px;
            text-decoration: underline; padding: 0; margin-top: 4px; display: inline-block;
        }
    </style>
</head>
<body>
    <div id="bg-layer"></div>

    <div class="container">
        <h1>智慧养老系统</h1>
        <p class="desc">养老院日常管理工具 &middot; 人脸识别 &middot; 实时监控 &middot; 告警通知</p>
        <a href="/auth/login?force=1" class="btn">登录系统</a>
        <div class="footer">v1.0.0</div>
    </div>

    <button class="bg-toggle" onclick="openBgModal()" title="换背景">&#x1F3A8;</button>

    <div id="bgModal" class="bg-modal" onclick="if(event.target===this)closeBgModal()">
        <div class="bg-modal-body" onclick="event.stopPropagation()">
            <h3>更换背景</h3>

            <div class="bg-option">
                <label>上传图片</label>
                <input type="file" id="bgUpload" accept="image/*" onchange="handleBgUpload(this)">
                <span style="font-size:11px;color:#999;">png/jpg/gif/webp, 不超过5MB</span>
            </div>

            <div class="bg-option">
                <label>图片链接</label>
                <input type="text" id="bgUrl" placeholder="https://...">
                <button class="btn-link" onclick="applyBgUrl()">使用此链接</button>
            </div>

            <div class="bg-option">
                <label>预设颜色</label>
                <div class="preset-list">
                    <div class="preset-dot" style="background:linear-gradient(135deg,#667eea,#764ba2);" onclick="applyGradient('linear-gradient(135deg, #667eea 0%, #764ba2 100%)')"></div>
                    <div class="preset-dot" style="background:linear-gradient(135deg,#4facfe,#00f2fe);" onclick="applyGradient('linear-gradient(135deg, #4facfe 0%, #00f2fe 100%)')"></div>
                    <div class="preset-dot" style="background:linear-gradient(135deg,#43e97b,#38f9d7);" onclick="applyGradient('linear-gradient(135deg, #43e97b 0%, #38f9d7 100%)')"></div>
                    <div class="preset-dot" style="background:linear-gradient(135deg,#fa709a,#fee140);" onclick="applyGradient('linear-gradient(135deg, #fa709a 0%, #fee140 100%)')"></div>
                    <div class="preset-dot" style="background:linear-gradient(135deg,#f093fb,#f5576c);" onclick="applyGradient('linear-gradient(135deg, #f093fb 0%, #f5576c 100%)')"></div>
                    <div class="preset-dot" style="background:#2c3e50;" onclick="applyGradient('#2c3e50')"></div>
                    <div class="preset-dot" style="background:#34495e;" onclick="applyGradient('#34495e')"></div>
                    <div class="preset-dot" style="background:#c0392b;" onclick="applyGradient('#c0392b')"></div>
                </div>
            </div>

            <div class="bg-preview" id="bgPreview"></div>

            <div class="modal-actions">
                <button class="btn-muted" onclick="resetBg()">恢复默认</button>
                <button class="btn-muted" onclick="closeBgModal()">关闭</button>
            </div>
        </div>
    </div>

    <script>
        var bgLayer = document.getElementById('bg-layer');

        function applyBackground(value, isImage) {
            bgLayer.classList.remove('loaded');
            if (!isImage) {
                bgLayer.style.background = value;
                bgLayer.style.backgroundImage = 'none';
                bgLayer.classList.add('loaded');
                updatePreview();
                return;
            }
            var img = new Image();
            img.onload = function() {
                bgLayer.style.background = value;
                bgLayer.style.backgroundSize = 'cover';
                bgLayer.style.backgroundPosition = 'center';
                bgLayer.style.backgroundAttachment = 'fixed';
                bgLayer.classList.add('loaded');
                updatePreview();
            };
            img.onerror = function() {
                bgLayer.style.background = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
                bgLayer.classList.add('loaded');
                updatePreview();
            };
            var m = value.match(/url\(["']?([^"')]+)["']?\)/);
            img.src = m ? m[1] : value;
        }

        function saveConfig(key, value) {
            return fetch('/api/system-config', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({key: key, value: value})
            }).then(function(r) { return r.json(); }).catch(function(e) {
                if (key === 'login_background') localStorage.setItem('login_background_tmp', value);
                return {success: false};
            });
        }

        function updatePreview() {
            var p = document.getElementById('bgPreview');
            p.style.background = bgLayer.style.background || getComputedStyle(bgLayer).background;
            if (bgLayer.style.backgroundImage && bgLayer.style.backgroundImage !== 'none') {
                p.style.backgroundSize = 'cover';
                p.style.backgroundPosition = 'center';
            }
        }

        function handleBgUpload(input) {
            var file = input.files[0];
            if (!file) return;
            var allowed = ['image/png','image/jpeg','image/jpg','image/gif','image/webp'];
            if (allowed.indexOf(file.type) === -1) { alert('不支持的文件格式'); input.value = ''; return; }
            if (file.size > 5*1024*1024) { alert('文件不能超过5MB'); input.value = ''; return; }

            var fd = new FormData();
            fd.append('image', file);
            fetch('/api/upload-login-bg', {method:'POST', body:fd})
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.success) {
                        applyBackground('url(' + res.path + ')', true);
                    } else {
                        alert('上传失败: ' + res.message);
                    }
                }).catch(function(e) { alert('上传失败: ' + e.message); });
        }

        function applyBgUrl() {
            var url = document.getElementById('bgUrl').value.trim();
            if (!url) { alert('请输入图片链接'); return; }
            var bg = 'url(' + url + ')';
            saveConfig('login_background', bg);
            applyBackground(bg, true);
        }

        function applyGradient(g) {
            saveConfig('login_background', g);
            applyBackground(g, false);
        }

        function resetBg() {
            var d = 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)';
            saveConfig('login_background', d);
            applyBackground(d, false);
            document.getElementById('bgUrl').value = '';
            document.getElementById('bgUpload').value = '';
        }

        function openBgModal() {
            document.getElementById('bgModal').style.display = 'flex';
            updatePreview();
        }
        function closeBgModal() {
            document.getElementById('bgModal').style.display = 'none';
        }

        function loadBackground() {
            fetch('/api/system-config')
                .then(function(r) { return r.json(); })
                .then(function(res) {
                    if (res.success && res.configs && res.configs.login_background) {
                        var bg = res.configs.login_background;
                        applyBackground(bg, bg.indexOf('url') === 0);
                    } else {
                        var tmp = localStorage.getItem('login_background_tmp');
                        applyBackground(tmp || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', tmp && tmp.indexOf('url') === 0);
                    }
                }).catch(function() {
                    var tmp = localStorage.getItem('login_background_tmp');
                    applyBackground(tmp || 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)', tmp && tmp.indexOf('url') === 0);
                });
        }

        loadBackground();
    </script>
</body>
</html>
